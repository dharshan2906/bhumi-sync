version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bhumi_sync_postgis
    environment:
      POSTGRES_DB: bhumi_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./schema_postgis.sql:/docker-entrypoint-initdb.d/schema_postgis.sql
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bhumi_sync_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/bhumi_sync
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhumi_sync_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgis_data:
